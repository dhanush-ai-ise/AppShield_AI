services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: appshield
      POSTGRES_PASSWORD: appshield
      POSTGRES_DB: appshield
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pg_data:
  mongo_data:
